# Passthrough Route — PostgreSQL handles TLS, route passes encrypted traffic.
# Clients connect to host:443 with sslmode=require (or disable for self-signed).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: postgres-hub
  labels:
    app: postgres
    app.kubernetes.io/part-of: maas-multicluster-poc
spec:
  to:
    kind: Service
    name: postgres
    weight: 100
  port:
    targetPort: postgres
  tls:
    termination: passthrough
  wildcardPolicy: None
