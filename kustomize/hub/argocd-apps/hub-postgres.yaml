apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maas-poc-hub-postgres
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/jland-redhat/multicluster-maas-poc.git
    targetRevision: main
    path: kustomize/hub/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
