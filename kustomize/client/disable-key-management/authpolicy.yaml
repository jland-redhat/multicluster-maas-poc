# Deny all public API key management on client clusters.
# Internal Authorino -> maas-api /internal/v1/api-keys/validate is cluster-local and unaffected.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: maas-api-disable-key-management
  labels:
    app.kubernetes.io/part-of: maas-multicluster-poc
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: maas-api-route
  rules:
    authorization:
      deny-key-management:
        when:
          - predicate: request.path.startsWith("/maas-api/v1/api-keys")
        metrics: false
        priority: 100
        opa:
          rego: |
            default allow = false
            allow { false }
