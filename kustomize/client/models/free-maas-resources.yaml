apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: facebook-opt-125m-simulated
  namespace: llm
  annotations:
    openshift.io/display-name: "Facebook OPT 125M (Simulated)"
spec:
  modelRef:
    kind: LLMInferenceService
    name: facebook-opt-125m-simulated
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: simulator-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Simulator Access (Free)"
spec:
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: simulator-subscription
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Simulator Subscription (Free)"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 100
          window: 1m
  priority: 10
