apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: premium-simulated-simulated-premium
  namespace: llm
  annotations:
    openshift.io/display-name: "Premium Simulator"
spec:
  modelRef:
    kind: LLMInferenceService
    name: premium-simulated-simulated-premium
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: premium-simulator-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Premium Simulator Access"
spec:
  modelRefs:
    - name: premium-simulated-simulated-premium
      namespace: llm
  subjects:
    groups:
      - name: premium-user
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: premium-simulator-subscription
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Premium Simulator Subscription"
spec:
  owner:
    groups:
      - name: premium-user
    users: []
  modelRefs:
    - name: premium-simulated-simulated-premium
      namespace: llm
      tokenRateLimits:
        - limit: 1000
          window: 1m
  priority: 20
