{{- if .Values.git.repoURL }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maas-poc-models
  namespace: {{ .Values.argocd.namespace }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.git.repoURL | quote }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: kustomize/common/models
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
